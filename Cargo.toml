[workspace]
# OTUA Protocol — Rust workspace
#
# This workspace contains the future Soroban smart contract layer.
# The TypeScript application layer is managed separately via pnpm workspaces.
#
# Members are Rust crates only. Do not add TypeScript packages here.
members = [
    "contracts/group-buy-escrow",
]
resolver = "2"

[workspace.package]
version = "0.1.0-foundation"
authors = []
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/otua-protocol/otua-protocol"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
