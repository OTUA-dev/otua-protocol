name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 03:00 UTC to catch newly disclosed vulnerabilities.
    - cron: '0 3 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Audit for known vulnerabilities. --audit-level=high fails only on
        # high or critical severity issues to reduce noise from low-severity
        # advisories in transitive dependencies.
        run: pnpm audit --audit-level=high
        # Note: remove `continue-on-error` once the lockfile is stable and
        # initial audit results have been reviewed.
        continue-on-error: true

  cargo-audit:
    name: Dependency audit (cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        # No Rust dependencies at foundation phase — this is a no-op
        # but establishes the pattern for when dependencies are added.
        run: cargo audit
        continue-on-error: true

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only runs on pull requests — reviews newly added or changed dependencies.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
